<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - المنصة الشاملة للتشخيص والتأهيل</title>

    <!-- التحقق إذا كان مسجلاً بالفعل، يتم توجيهه إلى home.html فوراً -->
    <script>
        if (localStorage.getItem("currentUser")) {
            window.location.replace("home.html");
        }
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cairo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top right, #f0fdfa, #f8fafc);
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- شريط علوي مبسط متناسق -->
    <header class="bg-gradient-to-r from-teal-700 to-cyan-800 text-white shadow-md py-4 px-6 text-center">
        <h1 class="text-xl md:text-2xl font-black tracking-tight">المنصة الشاملة للتشخيص والتأهيل</h1>
        <p class="text-cyan-200 text-xs mt-1">بوابة المقاييس النفسية، تقييم اضطرابات النمائية، وتدريبات النطق والتخاطب</p>
    </header>

    <!-- بطاقة تسجيل الدخول -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-xl border border-slate-200/80 p-8 md:p-10 relative overflow-hidden">
            <div class="absolute top-0 right-0 left-0 h-2 bg-gradient-to-r from-teal-600 via-cyan-600 to-teal-500"></div>

            <div class="text-center mb-8">
                <div class="w-20 h-20 mx-auto rounded-3xl bg-teal-50 border border-teal-100 text-teal-700 flex items-center justify-center shadow-inner mb-4">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-black text-slate-800">تسجيل الدخول للمنظومة</h2>
                <p class="text-slate-500 text-xs mt-2">يرجى إدخال اسم المستخدم وكلمة المرور المعتمدة للمتابعة</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-2">اسم المستخدم</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </span>
                        <input type="text" id="username" required
                            class="w-full pr-11 pl-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-transparent transition-all"
                            placeholder="أدخل اسم المستخدم">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-2">كلمة المرور</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                            </svg>
                        </span>
                        <input type="password" id="password" required
                            class="w-full pr-11 pl-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-transparent transition-all"
                            placeholder="••••••••">
                    </div>
                </div>

                <div id="statusBox" class="hidden text-xs rounded-xl p-3 text-center font-bold"></div>

                <button type="submit" id="submitBtn"
                    class="w-full py-3.5 px-4 bg-gradient-to-r from-teal-700 to-cyan-800 hover:from-teal-800 hover:to-cyan-900 text-white font-bold rounded-xl shadow-lg shadow-teal-700/20 hover:shadow-xl transition-all duration-200 flex items-center justify-center space-x-2 space-x-reverse">
                    <span>تسجيل الدخول</span>
                </button>
            </form>

            <!-- فاصل تنظيمي -->
            <div class="relative my-6 text-center">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
                <div class="relative flex justify-center text-xs"><span class="bg-white px-3 text-slate-400 font-semibold">أو</span></div>
            </div>

            <!-- خيار الحصول على اشتراك عبر واتساب -->
            <a href="https://wa.me/201212436658?text=%D8%A7%D8%B1%D9%8A%D8%AF%20%D8%A7%D9%84%D8%AD%D8%B5%D9%88%D9%84%20%D8%B9%D9%84%D9%89%20%D8%A7%D8%B4%D8%AA%D8%B1%D8%A7%D9%83%20%D8%A8%D8%A7%D9%84%D9%85%D9%86%D8%B5%D8%A9"
                target="_blank"
                class="w-full py-3 px-4 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 font-bold rounded-xl transition-all duration-200 flex items-center justify-center gap-2 shadow-sm text-sm">
                <!-- أيقونة واتساب SVG -->
                <svg class="w-5 h-5 text-emerald-600" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.771-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.007c.101.005.237-.038.37.283.144.346.491 1.2.534 1.287s.072.188.014.304c-.058.116-.087.188-.173.289l-.26.304c-.087.087-.179.181-.077.355.101.173.452.746.97 1.208.669.596 1.233.78 1.406.867.173.087.275.072.376-.044.101-.116.433-.506.549-.68.116-.173.231-.144.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.099.824zm-3.394-10.416c-5.523 0-10 4.477-10 10 0 1.764.459 3.423 1.264 4.871l-1.298 4.743 4.863-1.275c1.401.766 3.003 1.206 4.707 1.206 5.523 0 10-4.477 10-10 0-5.523-4.477-10-10-10z"/>
                </svg>
                <span>الحصول على اشتراك</span>
            </a>
        </div>
    </main>

    <!-- الفوتر مع حقوق التطوير -->
    <footer class="py-4 text-center border-t border-slate-200 text-xs text-slate-500 bg-white">
        تطوير الباش_أخصائي©
    </footer>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxGhZDoNtGJSKLDnoA1KfPY7-QG9fQjvaqDWpOLpLedLi9hnb5ZUNf6l-61r-oGoNy0SA/exec";

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById("username").value.trim();
            const p = document.getElementById("password").value;
            const statusBox = document.getElementById("statusBox");
            const btn = document.getElementById("submitBtn");

            btn.disabled = true;
            btn.innerHTML = `<span class="animate-pulse">جاري التحقق من الحساب...</span>`;
            statusBox.className = "text-xs rounded-xl p-3 text-center font-bold bg-teal-50 text-teal-800 border border-teal-200 block";
            statusBox.innerText = "جاري الاتصال بقاعدة البيانات وقفل الحساب...";

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "login", username: u, password: p })
                });

                const data = await response.json();

                if (data.status === "success") {
                    statusBox.className = "text-xs rounded-xl p-3 text-center font-bold bg-emerald-50 text-emerald-800 border border-emerald-200 block";
                    statusBox.innerText = "تم تسجيل الدخول بنجاح! جاري تحويلك...";
                    
                    // حفظ المستخدم بشكل دائم في المتصفح
                    localStorage.setItem("currentUser", u);
                    
                    setTimeout(() => {
                        window.location.replace("home.html");
                    }, 700);
                } else {
                    statusBox.className = "text-xs rounded-xl p-3 text-center font-bold bg-rose-50 text-rose-800 border border-rose-200 block";
                    statusBox.innerText = data.message || "بيانات الدخول غير صحيحة.";
                    btn.disabled = false;
                    btn.innerHTML = "<span>تسجيل الدخول</span>";
                }
            } catch (err) {
                statusBox.className = "text-xs rounded-xl p-3 text-center font-bold bg-rose-50 text-rose-800 border border-rose-200 block";
                statusBox.innerText = "تعذر الاتصال بالخادم. يرجى التحقق من اتصال الإنترنت.";
                btn.disabled = false;
                btn.innerHTML = "<span>تسجيل الدخول</span>";
            }
        }
    </script>
</body>
</html>
